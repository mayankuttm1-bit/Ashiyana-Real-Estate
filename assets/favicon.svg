      <stop offset="0%" stop-color="#E6CA65"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#A37B24"/>
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B47"/>
      <stop offset="100%" stop-color="#091424"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favNavy)" stroke="url(#favGold)" stroke-width="2.5"/>
  <!-- Ashiyana Architectural Monogram: Modern 'A' with House Silhouette & Foundation Land Contours -->
