<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" width="380" height="64" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .brand-title-dark {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: #0B192C;
      }
      .brand-sub-dark {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 2.5px;
        fill: #9F7920;
      }
    </style>
    <linearGradient id="goldLinearDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C365"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#A37B24"/>
    </linearGradient>
  </defs>

  <!-- Minimalist Emblem -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="10" fill="#0B192C" stroke="url(#goldLinearDark)" stroke-width="2"/>
    <path d="M26 11 L43 27 L37 27 L26 16.5 L15 27 L9 27 Z" fill="url(#goldLinearDark)"/>
    <path d="M19 40 L26 22 L33 40 L28.5 40 L26 33 L23.5 40 Z" fill="#FFFFFF"/>
    <circle cx="26" cy="28.5" r="1.5" fill="url(#goldLinearDark)"/>
  </g>

  <!-- Clean Brand Name & Subtitle -->
  <g transform="translate(72, 8)">
    <text x="0" y="27" class="brand-title-dark">ASHIYANA</text>
    <text x="1" y="43" class="brand-sub-dark">REAL ESTATE &amp; LAND DEVELOPERS</text>
  </g>
</svg>
